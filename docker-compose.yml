services:
  web:
    build: .

    ports:
      - "5000:5000"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flask_db
      POSTGRES_HOST: db
      SECRET_KEY: devops_secret_key

    depends_on:
      - db

    restart: always

  db:
    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flask_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

volumes:
  postgres_data: